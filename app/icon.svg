<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SAKHI">
  <defs>
    <!-- Tapered leaf veins are cut out, so the mark works on light and dark backgrounds. -->
    <mask id="veins" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M58.9 71.3 30.2 40.8 29.8 41.2 56.1 73.7Z" fill="#000"/>
      <path d="M67.4 75.2 99.2 35.2 98.8 34.8 64.6 72.8Z" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#veins)">
    <!-- left leaf -->
    <path d="M59 76C37 77 21 60 24 36C46 34 62 52 59 76Z" fill="#0a7d68"/>
    <!-- right leaf, with a lighter edge catching the light -->
    <path d="M64 78C61 49 80 26 108 27C110 56 92 78 64 78Z" fill="#0a7d68"/>
    <path d="M108 27C110 56 92 78 64 78C90 70 106 52 108 27Z" fill="#15a189"/>
  </g>
  <!-- short stem joining the sprout to the hand -->
  <path d="M61.5 77.5V84" stroke="#0a7d68" stroke-width="3.2" stroke-linecap="round"/>
  <!-- open hand holding the sprout -->
  <path d="M12 112C19 90 28 80 45 81C57 82 69 85 83 82C78 91 71 94 61 94C55 94 52 95 52.5 97C53.5 99.5 61 100.5 69 99.5C84 97.5 98 88 113 86C101 98 85 108 66 110C47 112 30 104 12 112Z" fill="#79b244"/>
</svg>
